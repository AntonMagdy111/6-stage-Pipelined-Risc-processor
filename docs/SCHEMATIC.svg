<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title>6-Stage Pipelined 32-Bit Von Neumann RISC Processor Schematic — Anton Magdy (@AntonMagdy111)</title>
  <desc>Architecture and forwarding datapath schematic of the 6-stage pipelined 32-bit Von Neumann RISC processor designed by Anton Magdy (@AntonMagdy111), licensed under Apache-2.0.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>6-Stage Pipelined 32-Bit Von Neumann RISC Processor</dc:title>
        <dc:creator>Anton Magdy (@AntonMagdy111)</dc:creator>
        <dc:rights>Copyright (c) 2026 Anton Magdy. Licensed under Apache-2.0.</dc:rights>
        <dc:source>https://github.com/AntonMagdy111/6-stage-Pipelined-Risc-processor</dc:source>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="620" rx="12" fill="url(#bg)"/>

  <!-- Title Banner -->
  <rect x="20" y="16" width="1240" height="56" rx="10" fill="#0f172a"/>
  <text x="42" y="42" fill="#ffffff" font-size="20" font-weight="700">6-Stage Pipelined 32-Bit Von Neumann RISC Processor (Single-Edge Rising-Clock)</text>
  <rect x="946" y="23" width="302" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1097" y="39" text-anchor="middle" fill="#e0f2fe" font-size="11.5" font-weight="700">Designed by Anton Magdy (@AntonMagdy111)</text>
  <text x="42" y="61" fill="#94a3b8" font-size="12">IF &#x2192; ID &#x2192; EX1 &#x2192; EX2 &#x2192; MEM &#x2192; WB  |  Unified 3-Bit Age-Ordered Forwarding  |  1-Cycle Load-Use Stall  |  16-Entry 2-Bit BTB + Zero-Bubble JMP/CALL  |  CCR Shadow Stack</text>

  <!-- Stage Headers -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#475569">
    <text x="112" y="96">STAGE 1: IF</text>
    <text x="322" y="96">STAGE 2: ID</text>
    <text x="540" y="96">STAGE 3: EX1</text>
    <text x="762" y="96">STAGE 4: EX2</text>
    <text x="985" y="96">STAGE 5: MEM</text>
    <text x="1182" y="96">STAGE 6: WB</text>
  </g>

  <!-- STAGE 1: IF -->
  <g filter="url(#shadow)">
    <rect x="34" y="106" width="156" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="46" y="120" width="132" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="112" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">PC (pc.vhd)</text>
    <text x="112" y="155" text-anchor="middle" font-size="10" fill="#3b82f6">Sync Reset &#x2190; M[0]</text>

    <rect x="46" y="176" width="132" height="58" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="112" y="195" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">2-Word Fetch FSM</text>
    <text x="112" y="210" text-anchor="middle" font-size="9.5" fill="#166534">Zero-Bubble JMP/CALL</text>
    <text x="112" y="224" text-anchor="middle" font-size="9.5" fill="#166534">INTR Drain (pause_fetch)</text>

    <rect x="46" y="246" width="132" height="50" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="112" y="265" text-anchor="middle" font-size="11.5" font-weight="700" fill="#713f12">16-Entry 2-Bit BTB</text>
    <text x="112" y="281" text-anchor="middle" font-size="9.5" fill="#854d0e">Cond Branches (JZ/JN/JC)</text>

    <rect x="46" y="306" width="132" height="38" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="112" y="323" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Unified Memory</text>
    <text x="112" y="337" text-anchor="middle" font-size="9.5" fill="#64748b">I-Port (4096 &#xD7; 32)</text>
  </g>

  <!-- Pipe Reg: IF/ID -->
  <rect x="204" y="114" width="24" height="234" rx="5" fill="#1e293b"/>
  <text x="216" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" transform="rotate(-90 216 231)">IF / ID</text>

  <!-- STAGE 2: ID -->
  <g filter="url(#shadow)">
    <rect x="242" y="106" width="160" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="254" y="120" width="136" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="322" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Control Unit</text>
    <text x="322" y="154" text-anchor="middle" font-size="9.5" fill="#1d4ed8">26 Opcodes &#x2192; ctrl_bundle</text>
    <text x="322" y="168" text-anchor="middle" font-size="9.5" fill="#1d4ed8">Explicit uses_rs1 / uses_rs2</text>

    <rect x="254" y="190" width="136" height="72" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="322" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">Register File (8&#xD7;32)</text>
    <text x="322" y="224" text-anchor="middle" font-size="9.5" fill="#7e22ce">2R / 2W (rising_edge)</text>
    <text x="322" y="238" text-anchor="middle" font-size="9.5" fill="#7e22ce">WB Write-Through Bypass</text>
    <text x="322" y="252" text-anchor="middle" font-size="9.5" fill="#7e22ce">SWAP Port Remapping</text>

    <rect x="254" y="274" width="136" height="70" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="322" y="293" text-anchor="middle" font-size="11.5" font-weight="700" fill="#881337">Hazard Unit</text>
    <text x="322" y="308" text-anchor="middle" font-size="9.5" fill="#be123c">1-Cycle LDD/POP/IN Stall</text>
    <text x="322" y="322" text-anchor="middle" font-size="9.5" fill="#be123c">Gated: valid, uses, !flush</text>
    <text x="322" y="336" text-anchor="middle" font-size="9.5" fill="#be123c">0-Stall OUT/PUSH (WB&#x2192;MEM)</text>
  </g>

  <!-- Pipe Reg: ID/EX1 -->
  <rect x="416" y="114" width="24" height="234" rx="5" fill="#1e293b"/>
  <text x="428" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" transform="rotate(-90 428 231)">ID / EX1</text>

  <!-- STAGE 3: EX1 -->
  <g filter="url(#shadow)">
    <rect x="454" y="106" width="172" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="466" y="120" width="148" height="78" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="540" y="139" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c4a6e">Unified 3-Bit Fwd Mux</text>
    <text x="540" y="154" text-anchor="middle" font-size="9.5" fill="#0369a1">sel_a / sel_b / sel_store</text>
    <text x="540" y="168" text-anchor="middle" font-size="9.5" fill="#0369a1">Age 1: EX1/EX2 (ALU/SWAP)</text>
    <text x="540" y="181" text-anchor="middle" font-size="9.5" fill="#0369a1">Age 2: MEM | Age 3: WB</text>
    <text x="540" y="193" text-anchor="middle" font-size="9" fill="#0369a1">Zero SWAP priority conflict</text>

    <rect x="466" y="210" width="148" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="540" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">32-Bit ALU</text>
    <text x="540" y="246" text-anchor="middle" font-size="9.5" fill="#1d4ed8">ADD, SUB, AND, NOT, INC</text>
    <text x="540" y="260" text-anchor="middle" font-size="9.5" fill="#1d4ed8">PASS, PASS_A (SWAP)</text>
    <text x="540" y="274" text-anchor="middle" font-size="9.5" fill="#1d4ed8">Flags: Z, N, C</text>

    <rect x="466" y="296" width="148" height="48" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="540" y="315" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Forwarding Unit</text>
    <text x="540" y="331" text-anchor="middle" font-size="9.5" fill="#64748b">Primary + SWAP Secondary</text>
  </g>

  <!-- Pipe Reg: EX1/EX2 -->
  <rect x="640" y="114" width="24" height="234" rx="5" fill="#1e293b"/>
  <text x="652" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" transform="rotate(-90 652 231)">EX1 / EX2</text>

  <!-- STAGE 4: EX2 -->
  <g filter="url(#shadow)">
    <rect x="678" y="106" width="168" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="690" y="120" width="144" height="64" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="762" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#713f12">Branch &amp; HLT Unit</text>
    <text x="762" y="153" text-anchor="middle" font-size="9.5" fill="#854d0e">Dir + Target Check</text>
    <text x="762" y="166" text-anchor="middle" font-size="9.5" fill="#854d0e">BTB Update (Cond Only)</text>
    <text x="762" y="178" text-anchor="middle" font-size="9.5" fill="#854d0e">Commit HLT &#x2192; PC=HLT+1</text>

    <rect x="690" y="194" width="144" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="762" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">SP &amp; Addr/Store Mux</text>
    <text x="762" y="227" text-anchor="middle" font-size="9.5" fill="#047857">SP (Reset=4095) &#xB1; 1</text>
    <text x="762" y="241" text-anchor="middle" font-size="9.5" fill="#047857">LDD / STD / PUSH / POP</text>
    <text x="762" y="255" text-anchor="middle" font-size="9.5" fill="#047857">Pass store_in for OUT/SWAP</text>

    <rect x="690" y="276" width="144" height="68" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="762" y="295" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a3412">CCR + Shadow Stack</text>
    <text x="762" y="310" text-anchor="middle" font-size="9.5" fill="#c2410c">Z, N, C (Clear on Taken Br)</text>
    <text x="762" y="324" text-anchor="middle" font-size="9.5" fill="#c2410c">8-Deep Save/Restore</text>
    <text x="762" y="337" text-anchor="middle" font-size="9" fill="#c2410c">(INT / INTR &#x2194; RTI)</text>
  </g>

  <!-- Pipe Reg: EX2/MEM -->
  <rect x="860" y="114" width="24" height="234" rx="5" fill="#1e293b"/>
  <text x="872" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" transform="rotate(-90 872 231)">EX2 / MEM</text>

  <!-- STAGE 5: MEM -->
  <g filter="url(#shadow)">
    <rect x="898" y="106" width="174" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="910" y="120" width="150" height="72" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="985" y="139" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Unified Memory D-Port</text>
    <text x="985" y="154" text-anchor="middle" font-size="9.5" fill="#166534">Comb Read / Rising Write</text>
    <text x="985" y="168" text-anchor="middle" font-size="9.5" fill="#166534">Vector Port: M[1] / M[2+i]</text>
    <text x="985" y="182" text-anchor="middle" font-size="9.5" fill="#166534">RET / RTI / INT Redirect</text>

    <rect x="910" y="204" width="150" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="985" y="223" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">WB Data Select Mux</text>
    <text x="985" y="239" text-anchor="middle" font-size="9.5" fill="#1d4ed8">ALU | MEM | IN.PORT | IMM</text>
    <text x="985" y="253" text-anchor="middle" font-size="9.5" fill="#1d4ed8">SWAP Secondary Routing</text>

    <rect x="910" y="276" width="150" height="68" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="985" y="296" text-anchor="middle" font-size="11.5" font-weight="700" fill="#831843">OUT.PORT Register</text>
    <text x="985" y="312" text-anchor="middle" font-size="9.5" fill="#be185d">Latched on out_en &amp; valid</text>
    <text x="985" y="328" text-anchor="middle" font-size="9.5" fill="#be185d">IN.PORT &#x2192; WB_IN (in_en)</text>
  </g>

  <!-- Pipe Reg: MEM/WB -->
  <rect x="1086" y="114" width="24" height="234" rx="5" fill="#1e293b"/>
  <text x="1098" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" transform="rotate(-90 1098 231)">MEM / WB</text>

  <!-- STAGE 6: WB -->
  <g filter="url(#shadow)">
    <rect x="1124" y="106" width="122" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="1134" y="156" width="102" height="148" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="1185" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">Write-Back</text>
    <text x="1185" y="204" text-anchor="middle" font-size="10" fill="#7e22ce">Port 1 (Primary)</text>
    <text x="1185" y="218" text-anchor="middle" font-size="9.5" fill="#6b21a8">rf_we &amp; valid</text>
    <line x1="1144" y1="232" x2="1226" y2="232" stroke="#d8b4fe" stroke-width="1"/>
    <text x="1185" y="252" text-anchor="middle" font-size="10" fill="#7e22ce">Port 2 (SWAP)</text>
    <text x="1185" y="266" text-anchor="middle" font-size="9.5" fill="#6b21a8">swap_we &amp; valid</text>
    <text x="1185" y="290" text-anchor="middle" font-size="9.5" font-weight="700" fill="#581c87">&#x2192; Register File</text>
  </g>

  <!-- Main Stage-to-Stage Datapath Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="190" y1="225" x2="202" y2="225"/>
    <line x1="228" y1="225" x2="240" y2="225"/>
    <line x1="402" y1="225" x2="414" y2="225"/>
    <line x1="440" y1="225" x2="452" y2="225"/>
    <line x1="626" y1="225" x2="638" y2="225"/>
    <line x1="664" y1="225" x2="676" y2="225"/>
    <line x1="846" y1="225" x2="858" y2="225"/>
    <line x1="884" y1="225" x2="896" y2="225"/>
    <line x1="1072" y1="225" x2="1084" y2="225"/>
    <line x1="1110" y1="225" x2="1122" y2="225"/>
  </g>

  <!-- Forwarding Network (Bottom Blue Bus) -->
  <g stroke="#0284c7" stroke-width="2.2" fill="none">
    <!-- EX1/EX2 -> EX1 -->
    <path d="M 652 348 L 652 404 L 560 404 L 560 358" marker-end="url(#arr-fwd)"/>
    <!-- MEM (mem_wb_data) -> EX1 -->
    <path d="M 985 356 L 985 432 L 540 432 L 540 358" marker-end="url(#arr-fwd)"/>
    <!-- WB -> EX1 and WB -> RF -->
    <path d="M 1185 356 L 1185 462 L 520 462 L 520 358" marker-end="url(#arr-fwd)"/>
    <path d="M 1185 462 L 322 462 L 322 358" marker-end="url(#arr-fwd)"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#0369a1">
    <rect x="670" y="392" width="230" height="20" rx="4" fill="#e0f2fe"/>
    <text x="785" y="406" text-anchor="middle">Age 1: EX1/EX2 Fwd (ALU / LDM / SWAP)</text>
    <rect x="670" y="421" width="280" height="20" rx="4" fill="#e0f2fe"/>
    <text x="810" y="435" text-anchor="middle">Age 2: MEM Fwd (mem_wb_data: ALU/MEM/IN/SWAP)</text>
    <rect x="670" y="451" width="320" height="20" rx="4" fill="#e0f2fe"/>
    <text x="830" y="465" text-anchor="middle">Age 3: WB Fwd &amp; Dual-Port Commit &#x2192; Register File</text>
  </g>

  <!-- Control / Flush / Stall Feedback (Bottom Red Bus) -->
  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" fill="none">
    <!-- MEM RET/RTI/INT redirect -> EX2 gate + PC flush -->
    <path d="M 950 356 L 950 512 L 112 512 L 112 358" marker-end="url(#arr-ctrl)"/>
    <!-- EX2 mispredict / HLT / BTB update -> IF -->
    <path d="M 762 356 L 762 512"/>
    <!-- Hazard stall -> IF & IF/ID & ID/EX1 -->
    <path d="M 285 356 L 285 490 L 145 490 L 145 358" marker-end="url(#arr-ctrl)"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#b91c1c">
    <rect x="360" y="500" width="465" height="22" rx="4" fill="#fee2e2"/>
    <text x="592" y="515" text-anchor="middle">Redirect / Flush Bus: mem_ret_redirect (gates EX2) | ex2_misp | ex2_halt | BTB Update</text>
    <rect x="155" y="478" width="124" height="18" rx="4" fill="#ffe4e6"/>
    <text x="217" y="491" text-anchor="middle">1-Cycle Stall</text>
  </g>

  <!-- Footer Verification Strip -->
  <rect x="34" y="546" width="1212" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="54" y="568" font-size="12" font-weight="700" fill="#0f172a">Verification &amp; Design Highlights (VHDL-2008 / ModelSim / Questa / GHDL)</text>
  <text x="1228" y="568" text-anchor="end" font-size="11" font-weight="600" fill="#0369a1">&#xA9; 2026 Anton Magdy (@AntonMagdy111)  |  Apache-2.0 License</text>
  <text x="54" y="587" font-size="11" fill="#475569">&#x2022; 16 Always-On Microarchitectural Assertions + SystemVerilog SVA/Covergroup Companion   &#x2022; Constrained-Random RTL vs. Golden ISS Cosimulation Fuzzer   &#x2022; 100% Opcode &amp; Forwarding Coverage   &#x2022; SDC Timing Constraints</text>
</svg>
