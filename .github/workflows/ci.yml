name: RTL & Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GHDL (VHDL-2008 simulator)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl g++ python3

      - name: Build C++17 assembler with strict warnings (-Wall -Wextra -Werror)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror assembler/assembler.cpp -o assembler/assembler
          ./assembler/assembler test/benchmarks/bench_fibonacci.asm /tmp/fib.mem
          diff -u test/benchmarks/bench_fibonacci.mem /tmp/fib.mem

      - name: Verify Python Golden ISS against all 100 custom tests & 4 benchmarks
        run: |
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, '.')
          import isa_sim

          do_txt = open('sim/run_all_100_tests.do').read()
          pat = re.compile(r'^run_one\s+\{([^}]+)\}\s+\{([^}]+)\}\s+(.*)$', re.M)
          ok = 0
          for m in pat.finditer(do_txt):
              name, memf, rest = m.groups()
              toks = rest.split()
              exp_r = [int(x, 16) for x in toks[0:8]]
              exp_sp = int(toks[8], 16)
              in_cnt = int(toks[9])
              in_vals = [int(x, 16) for x in toks[10:10+in_cnt]]
              cpu = isa_sim.CPU(isa_sim.load_mem(os.path.join('test/custom_tests_100', memf)))
              cpu.in_queue = in_vals
              cpu.run()
              assert cpu.regs == exp_r and cpu.sp == exp_sp, f"Golden mismatch on {name}"
              ok += 1
          assert ok == 100, f"Expected 100 tests, ran {ok}"
          print(f"Golden ISS passed {ok}/100 custom tests.")

          for b, exp_out in [
              ('bench_fibonacci.mem', 610),
              ('bench_array_sum.mem', 78),
              ('bench_recursive_sum.mem', 55),
              ('bench_bubble_sort.mem', 99),
          ]:
              cpu = isa_sim.CPU(isa_sim.load_mem(os.path.join('test/benchmarks', b)))
              cpu.run()
              assert cpu.halted and cpu.out_log[-1] == exp_out, f"Benchmark {b} failed"
          print("Golden ISS passed 4/4 benchmarks.")
          PY

      - name: Compile all VHDL-2008 RTL & testbench in GHDL
        run: |
          mkdir -p /tmp/ghdl_work
          cd /tmp/ghdl_work
          REPO=$GITHUB_WORKSPACE
          for f in \
            components/cpu_pkg.vhd \
            components/alu.vhd \
            components/RegisterFile.vhd \
            components/Memory.vhd \
            components/controlUnit.vhd \
            components/pc.vhd \
            components/sp.vhd \
            components/CCR.vhd \
            components/forwardingUnit.vhd \
            components/hazardDetectionUnit.vhd \
            components/outPutReg.vhd \
            components/branchPredictor.vhd \
            components/Pipelined_Registers/IF_ID.vhd \
            components/Pipelined_Registers/ID_EX1.vhd \
            components/Pipelined_Registers/EX1_EX2.vhd \
            components/Pipelined_Registers/EX2_MEM.vhd \
            components/Pipelined_Registers/MEM_WB.vhd \
            stages/fetchStage.vhd \
            stages/decodeStage.vhd \
            stages/execute1Stage.vhd \
            stages/execute2Stage.vhd \
            stages/memoryStage.vhd \
            stages/writeBackStage.vhd \
            Processor.vhd \
            tb_Processor.vhd; do
              ghdl -a --std=08 "$REPO/$f"
          done
          ghdl -e --std=08 tb_Processor

      - name: Run VHDL RTL + 14 live assertions in GHDL across core tests & benchmarks
        run: |
          cd /tmp/ghdl_work
          REPO=$GITHUB_WORKSPACE

          cp "$REPO/test/test_arithmetic.mem" program.mem
          ghdl -r --std=08 tb_Processor -gCHECK_AT_NS=1000 --stop-time=1200ns

          cp "$REPO/test/test_io.mem" program.mem
          ghdl -r --std=08 tb_Processor \
            -gEXP_R0=00000000000000000001001000110100 \
            -gEXP_R1=00000000000000001111111011101101 \
            -gEXP_R2=00000000000000000000000000000000 \
            -gEXP_R3=00000000000000000000000000000000 \
            -gEXP_R4=00000000000000000000000000000000 \
            -gEXP_R5=00000000000000000000000000000000 \
            -gEXP_R6=00000000000000000000000000000000 \
            -gEXP_R7=00000000000000000000000000000000 \
            -gCHECK_OUT=true \
            -gEXP_OUT=00000000000000001111111011101101 \
            -gCHECK_AT_NS=1000 --stop-time=1200ns

          cp "$REPO/test/benchmarks/bench_fibonacci.mem" program.mem
          ghdl -r --std=08 tb_Processor \
            -gEXP_R0=00000000000000000000001001100010 \
            -gEXP_R1=00000000000000000000001111011011 \
            -gEXP_R2=00000000000000000000000000001111 \
            -gEXP_R3=00000000000000000000000000001111 \
            -gEXP_R4=00000000000000000000001111011011 \
            -gEXP_R5=00000000000000000000000000000000 \
            -gEXP_R6=00000000000000000000000000000000 \
            -gEXP_R7=00000000000000000000000000000000 \
            -gCHECK_OUT=true \
            -gEXP_OUT=00000000000000000000001001100010 \
            -gCHECK_AT_NS=2500 --stop-time=3000ns

          cp "$REPO/test/benchmarks/bench_recursive_sum.mem" program.mem
          ghdl -r --std=08 tb_Processor \
            -gEXP_R0=00000000000000000000000000000000 \
            -gEXP_R1=00000000000000000000000000110111 \
            -gEXP_R2=00000000000000000000000000001010 \
            -gEXP_R3=00000000000000000000000000000000 \
            -gEXP_R4=00000000000000000000000000000000 \
            -gEXP_R5=00000000000000000000000000000000 \
            -gEXP_R6=00000000000000000000000000000000 \
            -gEXP_R7=00000000000000000000000000000000 \
            -gCHECK_OUT=true \
            -gEXP_OUT=00000000000000000000000000110111 \
            -gCHECK_AT_NS=3000 --stop-time=3500ns

          cp "$REPO/test/benchmarks/bench_bubble_sort.mem" program.mem
          ghdl -r --std=08 tb_Processor \
            -gEXP_R0=00000000000000000000001100000000 \
            -gEXP_R1=00000000000000000000000000010010 \
            -gEXP_R2=00000000000000000000000000000011 \
            -gEXP_R3=00000000000000000000000000000111 \
            -gEXP_R4=00000000000000000000000000010010 \
            -gEXP_R5=00000000000000000000000000101010 \
            -gEXP_R6=00000000000000000000000000110111 \
            -gEXP_R7=00000000000000000000000001100011 \
            -gCHECK_OUT=true \
            -gEXP_OUT=00000000000000000000000001100011 \
            -gCHECK_AT_NS=7000 --stop-time=7500ns

      - name: Run 14 adversarial corner-case RTL vs. Golden-ISS cosimulations in GHDL + 8 negative assembler tests
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, sys, tempfile
          REPO = os.environ["GITHUB_WORKSPACE"]
          sys.path.insert(0, REPO)
          sys.path.insert(0, os.path.join(REPO, "verification"))
          import isa_sim
          import corner_case_suite as ccs

          asm_exe = os.path.join(REPO, "assembler", "assembler")
          tmp = tempfile.mkdtemp(prefix="ghdl_cc_")
          ghdl_dir = "/tmp/ghdl_work"

          # 1. Negative assembler tests
          for bname, bsrc in ccs.BAD_ASM_TESTS:
              ap = os.path.join(tmp, f"bad_{bname}.asm")
              mp = os.path.join(tmp, f"bad_{bname}.mem")
              open(ap, "w").write(bsrc)
              r = subprocess.run([asm_exe, ap, mp], capture_output=True, text=True)
              assert r.returncode != 0, f"Assembler failed to reject {bname}"
          print(f"Assembler rejected {len(ccs.BAD_ASM_TESTS)}/{len(ccs.BAD_ASM_TESTS)} malformed inputs.")

          # 2. Run all 14 Golden-cosim corner-case tests in GHDL with all 16 assertions active!
          for name, ins, src in ccs.CORNER_TESTS:
              ap = os.path.join(tmp, f"{name}.asm")
              mp = os.path.join(tmp, f"{name}.mem")
              open(ap, "w").write(src)
              ra = subprocess.run([asm_exe, ap, mp], capture_output=True, text=True)
              assert ra.returncode == 0, f"Assemble failed on {name}:\n{ra.stderr}"

              cpu = isa_sim.CPU(isa_sim.load_mem(mp))
              cpu.in_queue = list(ins)
              cpu.run(max_steps=10000)
              assert cpu.halted, f"Golden ISS did not halt on {name}"

              shutil.copyfile(mp, os.path.join(ghdl_dir, "program.mem"))
              cmd = [
                  "ghdl", "-r", "--std=08", "tb_Processor",
                  *[f"-gEXP_R{i}={cpu.regs[i]:032b}" for i in range(8)],
                  f"-gEXP_SP={cpu.sp:032b}",
                  "-gCHECK_PC=true", f"-gEXP_PC={cpu.pc:032b}",
                  "-gCHECK_CCR=true", f"-gEXP_CCR={cpu.c}{cpu.n}{cpu.z}",
                  "-gCHECK_AT_NS=12000", "--stop-time=12500ns",
              ]
              if cpu.out_log:
                  cmd += ["-gCHECK_OUT=true", f"-gEXP_OUT={cpu.out_log[-1]:032b}"]
              if ins:
                  cmd += [f"-gIN_COUNT={len(ins)}"]
                  for idx, v in enumerate(ins[:8]):
                      cmd += [f"-gIN_VAL{idx}={v:032b}"]
              rg = subprocess.run(cmd, cwd=ghdl_dir, capture_output=True, text=True)
              assert rg.returncode == 0, f"GHDL failed on {name}:\n{rg.stdout}\n{rg.stderr}"
              print(f"  [GHDL PASS] {name}")

          shutil.rmtree(tmp, ignore_errors=True)
          print(f"All {len(ccs.CORNER_TESTS)} adversarial corner-case programs passed GHDL RTL cosimulation!")
          PY
